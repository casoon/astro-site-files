name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The root package uses npm, the site pnpm; the pnpm version is set here.
      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      # The site generates its own robots.txt, llms.txt, sitemap.xml, security.txt and
      # humans.txt with the package from this commit (site/package.json: "link:..").
      - name: Build package
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v6

      - name: Build site
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
          # .well-known/security.txt
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
